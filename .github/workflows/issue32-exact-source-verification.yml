name: Issue 32 isolated source verification

# One-shot diagnostic branch only. Never a required check or merge authority.
# The examined source is fetched separately at an immutable SHA; this workflow
# is not overlaid onto the source under test and is not intended for main.
on:
  push:
    branches: [verify/issue32-exact-source-20260922]
    paths: [.github/workflows/issue32-exact-source-verification.yml]

permissions: {}

concurrency:
  group: issue32-exact-source-20260922
  cancel-in-progress: false

jobs:
  source-tests:
    name: "Diagnostic source suite / ${{ matrix.suite }}"
    if: github.repository == '4444J99/organvm-ci-relay' && github.event_name == 'push' && contains(github.event.head_commit.message, '[relay-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - suite: pr30-admission
            source_sha: 70f2006590c7c5e809c33fbc314f5bfe2e9dfab7
          - suite: pr37-policy
            source_sha: dcc3538be7d6a357266c2096a897792472f2b233
          - suite: pr38-publication
            source_sha: 2549e321948d976a37a5814422c45b1d273fae2c
    env:
      SOURCE_SHA: ${{ matrix.source_sha }}
      SUITE: ${{ matrix.suite }}
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_NO_LAZY_FETCH: '1'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - name: Fetch immutable public source without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= -c core.hooksPath=/dev/null \
            fetch --no-tags --depth=1 \
            https://github.com/4444J99/organvm-ci-relay.git "$SOURCE_SHA"
          git -C source -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          export SOURCE_TREE="$(git -C source rev-parse 'HEAD^{tree}')"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          print(json.dumps({
              'schema': 'issue32.source-verification-start.v1',
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['SOURCE_SHA'],
              'source_tree': os.environ['SOURCE_TREE'],
              'suite': os.environ['SUITE'],
              'workflow_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'runner_os': os.environ['RUNNER_OS'],
              'native_scheduled_chat_proof': False,
              'merge_authority': False
          }, sort_keys=True))
          PY

      - name: Install the existing pinned Node runtime
        if: matrix.suite != 'pr38-publication'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Verify exact runtime
        if: matrix.suite != 'pr38-publication'
        shell: bash
        run: test "$(node --version)" = v22.23.2

      - name: Execute admission and enforcement tests
        if: matrix.suite == 'pr30-admission'
        working-directory: source
        shell: bash
        run: timeout 180s node --test admission-app/test/*.test.mjs

      - name: Execute complete policy regression suite
        if: matrix.suite != 'pr38-publication'
        working-directory: source
        shell: bash
        run: timeout 240s node scripts/test-policy.mjs --base-root .

      - name: Execute registry boundary tests
        if: matrix.suite != 'pr38-publication'
        working-directory: source
        shell: bash
        run: timeout 120s node --test scripts/test-registry-boundaries.mjs

      - name: Execute source policy self-check
        if: matrix.suite != 'pr38-publication'
        working-directory: source
        shell: bash
        run: timeout 120s node scripts/verify-policy.mjs --candidate-root . --base-root .

      - name: Execute complete publication helper tests
        if: matrix.suite == 'pr38-publication'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          git --version
          timeout 180s python3 -B -m unittest discover -s scripts -p 'test_connector_publish*.py' -v

      - name: Verify source stayed unchanged
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf 'Source suite completed for %s (%s). This is not activation or merge approval.\n' "$SOURCE_SHA" "$SUITE"

  laurea-tests:
    name: "Diagnostic Laurea / Python ${{ matrix.python }}"
    if: github.repository == '4444J99/organvm-ci-relay' && github.event_name == 'push' && contains(github.event.head_commit.message, '[laurea-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.11.16', '3.12.14']
    env:
      SOURCE_SHA: 8fcaaa729c87d37afb73e0a14ce0b8348b6e25ec
      SOURCE_BASE: faf6c5f67130925518233f5f99a76182b544fb85
      PROFILE_SHA: 0075acc195907fc5a51e3a9d0e35a4394e414111
      EXPECTED_PYTHON: ${{ matrix.python }}
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_NO_LAZY_FETCH: '1'
      PIP_NO_INPUT: '1'
    steps:
      - name: Set up already-authorized exact Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          check-latest: false

      - name: Fetch separate immutable public target and accepted profile
        shell: bash
        run: |
          set -euo pipefail
          for value in "$SOURCE_SHA" "$SOURCE_BASE" "$PROFILE_SHA"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          git init source
          git -C source -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags \
            https://github.com/organvm/laurea.git "$SOURCE_SHA" "$SOURCE_BASE"
          git -C source -c core.hooksPath=/dev/null checkout --detach "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git init relay-source
          git -C relay-source -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags --depth=1 \
            https://github.com/4444J99/organvm-ci-relay.git "$PROFILE_SHA"
          git -C relay-source -c core.hooksPath=/dev/null checkout --detach "$PROFILE_SHA"
          test "$(git -C relay-source rev-parse HEAD)" = "$PROFILE_SHA"
          printf '%s  %s\n' fa717be64b75f2b185a63904c10d9bae20ba31a76744df83278629f8908cb9f8 \
            relay-source/profiles/python-pytest-test-v1.sh | sha256sum -c -
          export SOURCE_TREE="$(git -C source rev-parse 'HEAD^{tree}')"
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          assert '.'.join(map(str, sys.version_info[:3])) == os.environ['EXPECTED_PYTHON']
          print(json.dumps({
              'schema': 'issue32.source-verification-start.v1',
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'repository': 'organvm/laurea',
              'repository_id': 1289397231,
              'source_sha': os.environ['SOURCE_SHA'],
              'source_tree': os.environ['SOURCE_TREE'],
              'profile_sha': os.environ['PROFILE_SHA'],
              'python': sys.version.split()[0],
              'workflow_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'native_scheduled_chat_proof': False,
              'canonical_relay_receipt': False,
              'merge_authority': False
          }, sort_keys=True))
          PY

      - name: Execute unchanged accepted Laurea profile
        working-directory: source
        shell: bash
        run: timeout 420s bash ../relay-source/profiles/python-pytest-test-v1.sh

      - name: Execute repository arena inventory and stale-table predicates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena/entries
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          laurea arena-table --entries arena/entries --baseline arena/baseline.json --leaderboard "$scratch/LEADERBOARD.md"
          if test "$(git diff --name-only "$SOURCE_BASE" HEAD -- LEADERBOARD.md)" = LEADERBOARD.md; then
            laurea arena-table --entries arena/entries --baseline arena/baseline.json --check
          fi

      - name: Verify source identity and tracked bytes remained unchanged
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf 'Diagnostic target suite completed for %s on Python %s; not native acceptance or canonical ledger publication.\n' "$SOURCE_SHA" "$EXPECTED_PYTHON"

  public-source-materials:
    name: Diagnostic public source materialization
    if: github.repository == '4444J99/organvm-ci-relay' && github.event_name == 'push' && contains(github.event.head_commit.message, '[materials-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - name: Bundle only the two requested immutable public revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir materials
          for spec in \
            'hospes|2d5c984465e121e1ced68f353b4255ebe935ea76|1ff46c273a9aef9ff5f6b920f62a2278aa394ef5' \
            'laurea|8fcaaa729c87d37afb73e0a14ce0b8348b6e25ec|e97c67dce19798babeb1203bef913e84322fa7e1'
          do
            IFS='|' read -r repository revision tree <<< "$spec"
            git init --bare "$repository.git"
            git -C "$repository.git" -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags \
              "https://github.com/organvm/$repository.git" "$revision"
            test "$(git -C "$repository.git" rev-parse FETCH_HEAD)" = "$revision"
            test "$(git -C "$repository.git" rev-parse 'FETCH_HEAD^{tree}')" = "$tree"
            git -C "$repository.git" update-ref refs/heads/diagnostic-source "$revision"
            git -C "$repository.git" bundle create "../materials/$repository.bundle" refs/heads/diagnostic-source
            git -C "$repository.git" bundle verify "../materials/$repository.bundle"
            printf '%s %s %s\n' "$repository" "$revision" "$tree" >> materials/source-manifest.txt
          done
          (cd materials && sha256sum hospes.bundle laurea.bundle source-manifest.txt > SHA256SUMS)
          cat materials/source-manifest.txt materials/SHA256SUMS
      - name: Retain bounded public source for direct-session verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-public-source-materials
          path: materials/
          if-no-files-found: error
          retention-days: 7

  hospes-python:
    name: Diagnostic Hospes / python-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.14'
    runs-on: ubuntu-latest
    steps:
    - name: Fetch separate immutable public source
      shell: bash
      run: |
        set -euo pipefail
        for value in "$SOURCE_SHA" "$SOURCE_BASE" "$SOURCE_TREE"; do
          [[ "$value" =~ ^[0-9a-f]{40}$ ]]
        done
        git init source
        git -C source remote add origin https://github.com/organvm/hospes.git
        git -C source -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags origin "$SOURCE_SHA" "$SOURCE_BASE"
        git -C source -c core.hooksPath=/dev/null checkout --detach "$SOURCE_SHA"
        git -C source update-ref refs/remotes/origin/main "$SOURCE_BASE"
        test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
        printf 'Exact public Hospes source %s tree %s base %s; diagnostic workflow %s.\n' "$SOURCE_SHA" "$SOURCE_TREE" "$SOURCE_BASE" "$GITHUB_SHA"
        python3 --version
        git --version
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install -e '.[test,api]'
      working-directory: source
      shell: bash
    - name: Run done predicate
      run: bash done.sh
      working-directory: source
      shell: bash
    - name: Verify exact tracked source after acceptance
      working-directory: source
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        printf 'Hospes diagnostic source remained unchanged: %s. No native acceptance, release or merge approval.\n' "$SOURCE_SHA"
    if: github.repository == '4444J99/organvm-ci-relay' && github.event_name == 'push' && contains(github.event.head_commit.message, '[hospes-only]')
    permissions: {}
    timeout-minutes: 10
    env:
      SOURCE_SHA: 2efd56177f477dc2373e2eb6c83af490682e188c
      SOURCE_TREE: 7ef9b31ec3c86e5f7c46f343b2bac0602d821c93
      SOURCE_BASE: 3ea044cf521296fe70a608dc64d4d03c338479ea
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      PIP_NO_INPUT: '1'
  hospes-dashboard-quality:
    name: Diagnostic Hospes / dashboard-quality
    runs-on: ubuntu-latest
    steps:
    - name: Fetch separate immutable public source
      shell: bash
      run: |
        set -euo pipefail
        for value in "$SOURCE_SHA" "$SOURCE_BASE" "$SOURCE_TREE"; do
          [[ "$value" =~ ^[0-9a-f]{40}$ ]]
        done
        git init source
        git -C source remote add origin https://github.com/organvm/hospes.git
        git -C source -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags origin "$SOURCE_SHA" "$SOURCE_BASE"
        git -C source -c core.hooksPath=/dev/null checkout --detach "$SOURCE_SHA"
        git -C source update-ref refs/remotes/origin/main "$SOURCE_BASE"
        test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
        printf 'Exact public Hospes source %s tree %s base %s; diagnostic workflow %s.\n' "$SOURCE_SHA" "$SOURCE_TREE" "$SOURCE_BASE" "$GITHUB_SHA"
        python3 --version
        git --version
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install Python and browser dependencies
      run: pip install -e '.[test,api]'
      working-directory: source
      shell: bash
    - name: Install pinned dashboard tooling
      run: npm ci
      working-directory: source
      shell: bash
    - name: Install pinned Chromium
      run: npx playwright install --with-deps chromium
      working-directory: source
      shell: bash
    - name: Run authenticated mobile audit
      env:
        HOSPES_OPERATOR_TOKEN: synthetic-ci-operator-token
      run: bash scripts/run-dashboard-quality.sh
      working-directory: source
      shell: bash
    - name: Upload dashboard evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnostic-hospes-dashboard-quality
        path: source/artifacts/dashboard-quality
        if-no-files-found: error
        retention-days: 7
    - name: Verify exact tracked source after acceptance
      working-directory: source
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        printf 'Hospes diagnostic source remained unchanged: %s. No native acceptance, release or merge approval.\n' "$SOURCE_SHA"
    if: github.repository == '4444J99/organvm-ci-relay' && github.event_name == 'push' && contains(github.event.head_commit.message, '[hospes-only]')
    permissions: {}
    timeout-minutes: 20
    env:
      SOURCE_SHA: 2efd56177f477dc2373e2eb6c83af490682e188c
      SOURCE_TREE: 7ef9b31ec3c86e5f7c46f343b2bac0602d821c93
      SOURCE_BASE: 3ea044cf521296fe70a608dc64d4d03c338479ea
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      PIP_NO_INPUT: '1'
  hospes-postgresql-16:
    name: Diagnostic Hospes / postgresql-16
    runs-on: ubuntu-latest
    steps:
    - name: Fetch separate immutable public source
      shell: bash
      run: |
        set -euo pipefail
        for value in "$SOURCE_SHA" "$SOURCE_BASE" "$SOURCE_TREE"; do
          [[ "$value" =~ ^[0-9a-f]{40}$ ]]
        done
        git init source
        git -C source remote add origin https://github.com/organvm/hospes.git
        git -C source -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags origin "$SOURCE_SHA" "$SOURCE_BASE"
        git -C source -c core.hooksPath=/dev/null checkout --detach "$SOURCE_SHA"
        git -C source update-ref refs/remotes/origin/main "$SOURCE_BASE"
        test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
        printf 'Exact public Hospes source %s tree %s base %s; diagnostic workflow %s.\n' "$SOURCE_SHA" "$SOURCE_TREE" "$SOURCE_BASE" "$GITHUB_SHA"
        python3 --version
        git --version
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Install PostgreSQL 16 toolchain
      run: |
        sudo apt-get update
        sudo apt-get install --yes postgresql-16
      working-directory: source
      shell: bash
    - name: Verify PostgreSQL 16 TLS bootstrap and migration ledger
      env:
        HOSPES_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      run: bash scripts/verify-postgres-bootstrap.sh
      working-directory: source
      shell: bash
    - name: Verify exact tracked source after acceptance
      working-directory: source
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        printf 'Hospes diagnostic source remained unchanged: %s. No native acceptance, release or merge approval.\n' "$SOURCE_SHA"
    if: github.repository == '4444J99/organvm-ci-relay' && github.event_name == 'push' && contains(github.event.head_commit.message, '[hospes-only]')
    permissions: {}
    timeout-minutes: 10
    env:
      SOURCE_SHA: 2efd56177f477dc2373e2eb6c83af490682e188c
      SOURCE_TREE: 7ef9b31ec3c86e5f7c46f343b2bac0602d821c93
      SOURCE_BASE: 3ea044cf521296fe70a608dc64d4d03c338479ea
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      PIP_NO_INPUT: '1'
  hospes-complete:
    name: Diagnostic Hospes / hospes-done
    if: always() && github.repository == '4444J99/organvm-ci-relay' && github.event_name == 'push' && contains(github.event.head_commit.message, '[hospes-only]')
    needs:
    - hospes-python
    - hospes-dashboard-quality
    - hospes-postgresql-16
    runs-on: ubuntu-latest
    steps:
    - name: Require the complete Phase 0 predicate set
      env:
        PYTHON_RESULT: ${{ needs.hospes-python.result }}
        DASHBOARD_RESULT: ${{ needs.hospes-dashboard-quality.result }}
        POSTGRESQL_RESULT: ${{ needs.hospes-postgresql-16.result }}
      run: |
        test "$PYTHON_RESULT" = success
        test "$DASHBOARD_RESULT" = success
        test "$POSTGRESQL_RESULT" = success
    permissions: {}
    timeout-minutes: 10
