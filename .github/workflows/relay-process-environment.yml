name: "Relay: process-environment enactment"

run-name: >-
  relay ${{ inputs.profile }} @ ${{ inputs.sha }} via ${{ inputs.lead_provider }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Allowlisted public owner/repository
        required: true
        default: organvm/process-environment-enactment
        type: string
      sha:
        description: Full 40-character lowercase commit SHA
        required: true
        default: ffebb6fa1020098e18020f6a4a845cf933c0df3c
        type: string
      profile:
        description: Allowlisted relay-owned validation profile
        required: true
        default: process-environment-enactment-v1
        type: string
      lead_provider:
        description: Provenance label only; never grants access
        required: true
        default: operator
        type: string

# No target-repository credential is available to test jobs. Artifact transport
# uses GitHub's per-job Actions runtime token rather than repository permissions.
permissions: {}

concurrency:
  group: relay-${{ inputs.target }}-${{ inputs.profile }}-${{ inputs.sha }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.allow.outputs.owner }}
      repository: ${{ steps.allow.outputs.repository }}
      full_name: ${{ steps.allow.outputs.full_name }}
      profile: ${{ steps.allow.outputs.profile }}
      sha: ${{ steps.allow.outputs.sha }}
      stable_repository_id: ${{ steps.allow.outputs.stable_repository_id }}
      lead_provider: ${{ steps.allow.outputs.lead_provider }}
    steps:
      - name: Check out trusted relay configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: allow
        name: Enforce target, profile, and SHA allowlists
        shell: bash
        env:
          TARGET_REPO: ${{ inputs.target }}
          TARGET_SHA: ${{ inputs.sha }}
          TARGET_PROFILE: ${{ inputs.profile }}
          LEAD_PROVIDER: ${{ inputs.lead_provider }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_PROFILE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$LEAD_PROVIDER" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$ ]]

          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$TARGET_REPO" \
            > live-repository.json

          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config/targets.json', 'utf8'));
          const live = JSON.parse(fs.readFileSync('live-repository.json', 'utf8'));
          const repository = process.env.TARGET_REPO;
          const profile = process.env.TARGET_PROFILE;
          const entry = config.targets?.[repository];
          const implementedProfiles = new Set([
            'process-environment-enactment-v1'
          ]);

          if (!entry || entry.visibility !== 'public') {
            throw new Error(`Target is not an allowlisted public repository: ${repository}`);
          }
          if (!Array.isArray(entry.profiles) || !entry.profiles.includes(profile)) {
            throw new Error(`Profile ${profile} is not allowed for ${repository}`);
          }
          if (!implementedProfiles.has(profile)) {
            throw new Error(`Profile has no trusted workflow implementation: ${profile}`);
          }
          if (!/^[0-9]+$/.test(String(entry.stable_repository_id))) {
            throw new Error(`Invalid stable_repository_id for ${repository}`);
          }
          if (String(live.id) !== String(entry.stable_repository_id)) {
            throw new Error(`Repository ID mismatch for ${repository}`);
          }
          if (live.private !== false || live.visibility !== 'public') {
            throw new Error(`Live repository is not public: ${repository}`);
          }
          if (String(live.full_name).toLowerCase() !== repository.toLowerCase()) {
            throw new Error(`Canonical repository name mismatch for ${repository}`);
          }

          const [owner, name] = repository.split('/');
          const lines = {
            owner,
            repository: name,
            full_name: repository,
            profile,
            sha: process.env.TARGET_SHA,
            stable_repository_id: String(entry.stable_repository_id),
            lead_provider: process.env.LEAD_PROVIDER
          };
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(lines).map(([key, value]) => `${key}=${value}\n`).join('')
          );
          NODE

  posix:
    name: POSIX / ${{ matrix.os }}
    needs: authorize
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            receipt_label: ubuntu
          - os: macos-latest
            receipt_label: macos
    env:
      TARGET_REPO: ${{ needs.authorize.outputs.full_name }}
      TARGET_SHA: ${{ needs.authorize.outputs.sha }}
      TARGET_PROFILE: ${{ needs.authorize.outputs.profile }}
      RECEIPT_LABEL: ${{ matrix.receipt_label }}
    steps:
      - name: Fetch the allowlisted repository by exact SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir target
          git -C target init
          git -C target remote add origin \
            "https://github.com/${TARGET_REPO}.git"
          git -C target -c protocol.version=2 fetch \
            --no-tags --depth=1 origin "$TARGET_SHA"
          git -C target checkout --detach FETCH_HEAD
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_SHA" ]]

      - id: validate
        name: Compile, execute, and assert POSIX behavior
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          cc -Wall -Wextra -pedantic -std=c99 \
            posix-envp-enactment.c -o posix-envp-enactment

          ./posix-envp-enactment seed-edge | tee posix-edge.txt
          grep -Fx '000:some-other=values' posix-edge.txt
          grep -Fx '001:NAME+some-other=value+values' posix-edge.txt
          grep -Fx '002:=empty-name' posix-edge.txt
          grep -Fx '003:noequals' posix-edge.txt
          grep -Fx '004:name=value=with=equals' posix-edge.txt
          grep -Fx '005:dup=one' posix-edge.txt
          grep -Fx '006:dup=two' posix-edge.txt
          grep -Fx '007:NAME=value' posix-edge.txt
          if grep -F 'TAIL=x' posix-edge.txt; then exit 1; fi

          ./posix-envp-enactment seed-basic replicate | tee posix-replicate.txt
          diff -u <(printf '000:third=3\n001:first=1\n002:second=2\n') \
            posix-replicate.txt

          ./posix-envp-enactment seed-basic append | tee posix-append.txt
          diff -u \
            <(printf '000:third=3\n001:first=1\n002:second=2\n003:added=entry\n') \
            posix-append.txt

          ./posix-envp-enactment seed-basic omit | tee posix-omit.txt
          diff -u <(printf '000:third=3\n001:second=2\n') posix-omit.txt

          ./posix-envp-enactment seed-basic replace | tee posix-replace.txt
          diff -u \
            <(printf '000:third=3\n001:second=2\n002:first=replaced\n') \
            posix-replace.txt

          cat posix-edge.txt posix-replicate.txt posix-append.txt \
            posix-omit.txt posix-replace.txt > posix-output.txt
          shasum -a 256 posix-output.txt | tee posix-output.sha256

      - name: Upload untrusted POSIX observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: untrusted-observations-${{ matrix.receipt_label }}
          path: |
            target/posix-*.txt
            target/posix-output.sha256
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows / windows-latest
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      TARGET_REPO: ${{ needs.authorize.outputs.full_name }}
      TARGET_SHA: ${{ needs.authorize.outputs.sha }}
      TARGET_PROFILE: ${{ needs.authorize.outputs.profile }}
      RECEIPT_LABEL: windows
    steps:
      - name: Fetch the allowlisted repository by exact SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path target | Out-Null
          git -C target init
          git -C target remote add origin `
            "https://github.com/$env:TARGET_REPO.git"
          git -C target -c protocol.version=2 fetch `
            --no-tags --depth=1 origin $env:TARGET_SHA
          git -C target checkout --detach FETCH_HEAD
          $actual = git -C target rev-parse HEAD
          if ($actual -cne $env:TARGET_SHA) {
            throw "Fetched $actual instead of $env:TARGET_SHA"
          }

      - id: validate
        name: Compile, execute, and assert Windows behavior
        working-directory: target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          @echo off
          set "VSPATH="
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          if not defined VSPATH exit /b 1
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %ERRORLEVEL%
          cl /nologo /W4 /WX /std:c17 windows-lpenvironment-enactment.c
          if errorlevel 1 exit /b %ERRORLEVEL%
          windows-lpenvironment-enactment.exe > windows-output.txt
          set "HARNESS_EXIT=%ERRORLEVEL%"
          type windows-output.txt
          if not "%HARNESS_EXIT%"=="0" exit /b %HARNESS_EXIT%
          '@ | Set-Content -LiteralPath relay-build-and-run.cmd -Encoding ascii
          & cmd.exe /d /c relay-build-and-run.cmd
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build or harness exited $LASTEXITCODE"
          }

          $lines = @(Get-Content -LiteralPath windows-output.txt)
          if ($lines.Count -ne 18) {
            throw "Expected 18 observation lines; found $($lines.Count)"
          }

          $expected = [ordered]@{
            'CASE:inherit-null-lpEnvironment' = 1
            'CASE:custom-base-block' = 1
            'CASE:custom-append-block' = 1
            'CASE:custom-omit-block' = 1
            'CASE:custom-replace-block' = 1
            'PM_INHERITED=parent' = 1
            'PM_FIRST=1' = 2
            'PM_SECOND=2' = 4
            'PM_THIRD=3' = 4
            'PM_ADDED=entry' = 1
            'PM_FIRST=replaced' = 1
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = @($lines | Where-Object { $_ -ceq $entry.Key }).Count
            if ($actual -ne $entry.Value) {
              throw "Expected '$($entry.Key)' $($entry.Value) time(s); found $actual"
            }
          }

          $hash = (Get-FileHash windows-output.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  windows-output.txt" | Set-Content windows-output.sha256

      - name: Upload untrusted Windows observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: untrusted-observations-windows
          path: |
            target/windows-output.txt
            target/windows-output.sha256
          if-no-files-found: warn
          retention-days: 7

  receipt:
    name: Canonical isolated receipt
    if: always() && needs.authorize.result == 'success'
    needs: [authorize, posix, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: relay-receipt-main-writer
      cancel-in-progress: false
    env:
      POSIX_RESULT: ${{ needs.posix.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      TARGET_REPO: ${{ needs.authorize.outputs.full_name }}
      TARGET_SHA: ${{ needs.authorize.outputs.sha }}
      TARGET_PROFILE: ${{ needs.authorize.outputs.profile }}
      TARGET_REPOSITORY_ID: ${{ needs.authorize.outputs.stable_repository_id }}
      LEAD_PROVIDER: ${{ needs.authorize.outputs.lead_provider }}
    steps:
      - name: Check out the trusted relay only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true

      - id: canonical
        name: Build canonical receipt from trusted job results
        shell: bash
        env:
          RELAY_REPOSITORY: ${{ github.repository }}
          RELAY_EVENT_SHA: ${{ github.sha }}
          RELAY_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELAY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RELAY_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          receipt_dir="receipts/$TARGET_REPOSITORY_ID/$TARGET_SHA"
          receipt_file="$receipt_dir/$RUN_ID.$RUN_ATTEMPT.json"
          mkdir -p "$receipt_dir"
          export receipt_file
          node <<'NODE'
          const fs = require('fs');
          const allPassed = process.env.POSIX_RESULT === 'success' &&
            process.env.WINDOWS_RESULT === 'success';
          const receipt = {
            schema: 'organvm-ci-relay-receipt/v1',
            target: {
              stable_repository_id: process.env.TARGET_REPOSITORY_ID,
              repository: process.env.TARGET_REPO,
              sha: process.env.TARGET_SHA,
              profile: process.env.TARGET_PROFILE
            },
            relay: {
              repository: process.env.RELAY_REPOSITORY,
              workflow_sha: process.env.RELAY_WORKFLOW_SHA,
              workflow_ref: process.env.RELAY_WORKFLOW_REF,
              event_sha: process.env.RELAY_EVENT_SHA,
              run_id: process.env.RUN_ID,
              run_attempt: process.env.RUN_ATTEMPT,
              run_url: `https://github.com/${process.env.RELAY_REPOSITORY}/actions/runs/${process.env.RUN_ID}`
            },
            dispatch: {
              actor: process.env.RELAY_ACTOR,
              declared_lead_provider: process.env.LEAD_PROVIDER
            },
            trusted_job_results: {
              posix_matrix: process.env.POSIX_RESULT,
              windows: process.env.WINDOWS_RESULT
            },
            source_checkout_verified: allPassed,
            tests_and_assertions_executed: allPassed,
            aggregate: allPassed ? 'success' : 'error',
            generated_at: new Date().toISOString(),
            observations: 'Untrusted artifacts are not inputs to this receipt.'
          };
          fs.writeFileSync(process.env.receipt_file,
            JSON.stringify(receipt, null, 2) + '\n');
          NODE
          sha256sum "$receipt_file" > "$receipt_file.sha256"
          printf 'receipt_file=%s\n' "$receipt_file" >> "$GITHUB_OUTPUT"

      - name: Upload canonical receipt pair
        if: always() && steps.canonical.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-receipt
          path: |
            ${{ steps.canonical.outputs.receipt_file }}
            ${{ steps.canonical.outputs.receipt_file }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Commit the durable receipt
        shell: bash
        env:
          RECEIPT_FILE: ${{ steps.canonical.outputs.receipt_file }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RECEIPT_FILE" "$RECEIPT_FILE.sha256"
          git commit -m "receipt: $TARGET_REPOSITORY_ID $TARGET_SHA run $GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Write workflow summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# ORGANVM CI relay receipt'
            echo
            echo "- Target: \`$TARGET_REPO\`"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Profile: \`$TARGET_PROFILE\`"
            echo "- Declared lead provider: \`$LEAD_PROVIDER\`"
            echo "- POSIX matrix: \`$POSIX_RESULT\`"
            echo "- Windows: \`$WINDOWS_RESULT\`"
            echo "- Run: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce aggregate result
        shell: bash
        run: |
          set -euo pipefail
          [[ "$POSIX_RESULT" == success ]]
          [[ "$WINDOWS_RESULT" == success ]]
