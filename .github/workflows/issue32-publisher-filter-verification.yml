name: Publisher subprocess-boundary acceptance
on:
  push:
    branches: [verify/issue32-publisher-filter-20260924]
    paths: [.github/workflows/issue32-publisher-filter-verification.yml]
permissions: {}
concurrency:
  group: issue32-publisher-filter-diagnostic
  cancel-in-progress: false
jobs:
  source-test:
    if: github.repository_id == '1350979676' && github.ref == 'refs/heads/verify/issue32-publisher-filter-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {}
    env:
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify pinned fixed-executable repair and all regressions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 30 https://raw.githubusercontent.com/4444J99/organvm-ci-relay/c36446297cd609a62a3d7cdeed0263eb9045d4c1/scripts/issue32-static-git-repair.py > "$RUNNER_TEMP/repair.py"
          test "$(git hash-object "$RUNNER_TEMP/repair.py")" = ff1d609fb628921bb59355b1a59a02fc7ced75b1
          source_dir="$RUNNER_TEMP/source"
          git -c core.hooksPath=/dev/null init -q "$source_dir"
          git -c core.hooksPath=/dev/null -C "$source_dir" fetch --depth=1 https://github.com/4444J99/organvm-ci-relay.git 1aae0c3f36328dff5629f1c7a9f82e68862c9bb5
          git -c core.hooksPath=/dev/null -C "$source_dir" checkout --detach FETCH_HEAD
          cd "$source_dir"
          test "$(git rev-parse HEAD)" = 1aae0c3f36328dff5629f1c7a9f82e68862c9bb5
          test "$(git rev-parse 'HEAD^{tree}')" = 3b7e3b0796d707685d2dbcd99245159e39b45c4c
          python3 -B "$RUNNER_TEMP/repair.py" apply
          python3 -B -m unittest discover -s scripts -p 'test_connector_publish*.py' -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
          grep -Eq '^Ran 43 tests in ' "$RUNNER_TEMP/tests.log"
          grep -qx 'OK' "$RUNNER_TEMP/tests.log"
          node scripts/verify-policy.mjs --candidate-root . --base-root .
          node scripts/test-policy.mjs --base-root .
          node --test scripts/test-registry-boundaries.mjs
          git diff --check
          git diff --stat
          printf 'SUBPROCESS_EXECUTABLE_LITERAL=true SHELL_DISABLED=true\n'
  publish-work-branch:
    needs: source-test
    if: github.repository_id == '1350979676' && github.ref == 'refs/heads/verify/issue32-publisher-filter-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Fetch pinned deterministic source publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 30 https://raw.githubusercontent.com/4444J99/organvm-ci-relay/c36446297cd609a62a3d7cdeed0263eb9045d4c1/scripts/issue32-static-git-repair.py > "$RUNNER_TEMP/repair.py"
          test "$(git hash-object "$RUNNER_TEMP/repair.py")" = ff1d609fb628921bb59355b1a59a02fc7ced75b1
      - name: Advance only the exact unprotected PR38 branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B "$RUNNER_TEMP/repair.py" publish
