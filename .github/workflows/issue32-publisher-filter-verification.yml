name: Merged publisher and relay verification
on:
  push:
    branches: [verify/issue32-publisher-filter-20260924]
    paths: [.github/workflows/issue32-publisher-filter-verification.yml]
permissions: {}
concurrency:
  group: issue32-publisher-filter-diagnostic
  cancel-in-progress: false
jobs:
  accepted-main:
    if: github.repository_id == '1350979676' && github.ref == 'refs/heads/verify/issue32-publisher-filter-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {}
    env:
      EXPECTED_HEAD: 5e8d3dc793b6d2c25200b17c30892e795097d6e6
      EXPECTED_TREE: 575bec82c81a637e7e09ac5e2382544b3b80a805
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Execute accepted-main tests without credentials or source mutation
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/accepted-source"
          git -c core.hooksPath=/dev/null init -q "$source_dir"
          git -c core.hooksPath=/dev/null -C "$source_dir" fetch --depth=1 https://github.com/4444J99/organvm-ci-relay.git "$EXPECTED_HEAD"
          git -c core.hooksPath=/dev/null -C "$source_dir" checkout --detach FETCH_HEAD
          cd "$source_dir"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          printf 'ACCEPTED_HEAD=%s\nACCEPTED_TREE=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE"
          printf 'DEFINING_WORKFLOW=%s\nDEFINING_SHA=%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA"
          python3 --version
          git --version
          node --version
          python3 -B -m unittest discover -s scripts -p 'test_connector_publish*.py' -v 2>&1 | tee "$RUNNER_TEMP/publisher-tests.log"
          grep -Eq '^Ran 43 tests in ' "$RUNNER_TEMP/publisher-tests.log"
          grep -qx 'OK' "$RUNNER_TEMP/publisher-tests.log"
          node scripts/verify-policy.mjs --candidate-root . --base-root .
          node scripts/test-policy.mjs --base-root . | tee "$RUNNER_TEMP/policy-tests.log"
          grep -F 'verified 143 fail-closed relay policy regressions and 5 dynamic policy acceptance cases; 25 embedded receipt runtime cases' "$RUNNER_TEMP/policy-tests.log"
          node --test scripts/test-registry-boundaries.mjs
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          functions = []
          for path in Path('scripts').glob('*connector_publish*.py'):
              data = path.read_bytes()
              compile(data, str(path), 'exec')
              functions.extend(n for n in ast.walk(ast.parse(data)) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)))
          assert all(ast.get_docstring(n) for n in functions)
          print('PUBLISHER_FUNCTION_DOCSTRINGS_COMPLETE=true')
          PY
          git diff --exit-code HEAD
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git ls-files 'scripts/issue32-*' '.github/workflows/issue32-*')"
          printf 'SOURCE_UNCHANGED=true TEMPORARY_PUBLISHERS_ABSENT_FROM_MAIN=true\n'
