name: Publisher filter-safety diagnostic
on:
  push:
    branches: [verify/issue32-publisher-filter-20260924]
    paths: [.github/workflows/issue32-publisher-filter-verification.yml]
permissions: {}
concurrency:
  group: issue32-publisher-filter-diagnostic
  cancel-in-progress: false
jobs:
  exact-source:
    if: github.repository_id == '1350979676' && github.ref == 'refs/heads/verify/issue32-publisher-filter-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: publisher
            head: ed977e9679d567545b38e9f6c42f6814b4e7b9ca
            tree: 9f8e0e4d3f8cba381da75e11786a2720692d9408
          - suite: registry
            head: b12ca96b9c2cc7b478ad27ce1268de9694e75b59
            tree: de231bb1e9b988340b56397f7af11630ee6626b9
    env:
      EXPECTED_HEAD: ${{ matrix.head }}
      EXPECTED_TREE: ${{ matrix.tree }}
      SUITE: ${{ matrix.suite }}
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Anonymous exact-source verification
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/issue32-source"
          mkdir "$source_dir"
          git -c core.hooksPath=/dev/null -C "$source_dir" init -q
          git -c core.hooksPath=/dev/null -C "$source_dir" fetch --depth=1 https://github.com/4444J99/organvm-ci-relay.git "$EXPECTED_HEAD"
          git -c core.hooksPath=/dev/null -C "$source_dir" checkout --detach FETCH_HEAD
          cd "$source_dir"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          printf 'SOURCE_HEAD=%s\nSOURCE_TREE=%s\nSUITE=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE" "$SUITE"
          printf 'DEFINING_WORKFLOW=%s\nDEFINING_SHA=%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA"
          python3 --version
          git --version
          node --version
          case "$SUITE" in
            publisher)
              python3 -B -m unittest discover -s scripts -p 'test_connector_publish*.py' -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
              grep -Eq '^Ran 41 tests in ' "$RUNNER_TEMP/tests.log"
              grep -qx 'OK' "$RUNNER_TEMP/tests.log"
              python3 -B -c "from pathlib import Path; [compile(p.read_bytes(), str(p), 'exec') for p in Path('scripts').glob('*connector_publish*.py')]"
              ;;
            registry)
              node scripts/verify-policy.mjs --candidate-root . --base-root .
              node scripts/test-policy.mjs --base-root .
              node scripts/test-registry-boundaries.mjs
              ;;
            *) exit 2 ;;
          esac
          git diff --exit-code HEAD
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          printf 'SOURCE_UNCHANGED=true\n'
