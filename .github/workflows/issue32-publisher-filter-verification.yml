name: Exact-source publisher and relay acceptance
on:
  push:
    branches: [verify/issue32-publisher-filter-20260924]
    paths: [.github/workflows/issue32-publisher-filter-verification.yml]
permissions: {}
concurrency:
  group: issue32-publisher-filter-diagnostic
  cancel-in-progress: false
jobs:
  exact-source:
    if: github.repository_id == '1350979676' && github.ref == 'refs/heads/verify/issue32-publisher-filter-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {}
    env:
      EXPECTED_HEAD: c213307271c9fad22fe0c247b737f9e89f497b0c
      EXPECTED_TREE: 800a253d26a223f4211a3955858522f1debcc8f6
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify exact composed source without credentials
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/issue32-source"
          mkdir "$source_dir"
          git -c core.hooksPath=/dev/null -C "$source_dir" init -q
          git -c core.hooksPath=/dev/null -C "$source_dir" fetch --depth=1 https://github.com/4444J99/organvm-ci-relay.git "$EXPECTED_HEAD"
          git -c core.hooksPath=/dev/null -C "$source_dir" checkout --detach FETCH_HEAD
          cd "$source_dir"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          printf 'SOURCE_HEAD=%s\nSOURCE_TREE=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE"
          printf 'DEFINING_WORKFLOW=%s\nDEFINING_SHA=%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA"
          python3 --version
          git --version
          node --version
          python3 -B -m unittest discover -s scripts -p 'test_connector_publish*.py' -v 2>&1 | tee "$RUNNER_TEMP/publisher-tests.log"
          grep -Eq '^Ran 41 tests in ' "$RUNNER_TEMP/publisher-tests.log"
          grep -qx 'OK' "$RUNNER_TEMP/publisher-tests.log"
          node scripts/verify-policy.mjs --candidate-root . --base-root .
          node scripts/test-policy.mjs --base-root . | tee "$RUNNER_TEMP/policy-tests.log"
          grep -F 'verified 143 fail-closed relay policy regressions and 5 dynamic policy acceptance cases; 25 embedded receipt runtime cases' "$RUNNER_TEMP/policy-tests.log"
          node --test scripts/test-registry-boundaries.mjs
          python3 -B -c "from pathlib import Path; [compile(p.read_bytes(), str(p), 'exec') for p in Path('scripts').glob('*connector_publish*.py')]"
          git diff --exit-code HEAD
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          printf 'SOURCE_UNCHANGED=true\n'
