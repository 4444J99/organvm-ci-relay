name: Publisher documentation acceptance
on:
  push:
    branches: [verify/issue32-publisher-filter-20260924]
    paths: [.github/workflows/issue32-publisher-filter-verification.yml]
permissions: {}
concurrency:
  group: issue32-publisher-filter-diagnostic
  cancel-in-progress: false
jobs:
  documentation-test:
    if: github.repository_id == '1350979676' && github.ref == 'refs/heads/verify/issue32-publisher-filter-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {}
    env:
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify pinned documentation repair and unchanged executable AST
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 30 https://raw.githubusercontent.com/4444J99/organvm-ci-relay/7ac7962747b06f7609b907d1304903e84882bbbe/scripts/issue32-docstring-repair.py > "$RUNNER_TEMP/repair.py"
          test "$(git hash-object "$RUNNER_TEMP/repair.py")" = 229e77d097f80a212cf03c6dff0bc88e0ef37eed
          source_dir="$RUNNER_TEMP/doc-source"
          git -c core.hooksPath=/dev/null init -q "$source_dir"
          git -c core.hooksPath=/dev/null -C "$source_dir" fetch --depth=1 https://github.com/4444J99/organvm-ci-relay.git c213307271c9fad22fe0c247b737f9e89f497b0c
          git -c core.hooksPath=/dev/null -C "$source_dir" checkout --detach FETCH_HEAD
          cd "$source_dir"
          test "$(git rev-parse HEAD)" = c213307271c9fad22fe0c247b737f9e89f497b0c
          test "$(git rev-parse 'HEAD^{tree}')" = 800a253d26a223f4211a3955858522f1debcc8f6
          python3 -B "$RUNNER_TEMP/repair.py" apply
          python3 -B -m unittest discover -s scripts -p 'test_connector_publish*.py' -v 2>&1 | tee "$RUNNER_TEMP/doc-tests.log"
          grep -Eq '^Ran 41 tests in ' "$RUNNER_TEMP/doc-tests.log"
          grep -qx 'OK' "$RUNNER_TEMP/doc-tests.log"
          node scripts/verify-policy.mjs --candidate-root . --base-root .
          node scripts/test-policy.mjs --base-root .
          node --test scripts/test-registry-boundaries.mjs
          test "$(git diff --name-only HEAD | sort)" = $'scripts/connector_publish.py\nscripts/test_connector_publish.py'
          git diff --check
          git diff --stat
          printf 'DOCSTRINGS_COMPLETE=true EXECUTABLE_AST_UNCHANGED=true\n'
  publish-work-branch:
    needs: documentation-test
    if: github.repository_id == '1350979676' && github.ref == 'refs/heads/verify/issue32-publisher-filter-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Fetch independently pinned deterministic documentation publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 30 https://raw.githubusercontent.com/4444J99/organvm-ci-relay/7ac7962747b06f7609b907d1304903e84882bbbe/scripts/issue32-docstring-repair.py > "$RUNNER_TEMP/repair.py"
          test "$(git hash-object "$RUNNER_TEMP/repair.py")" = 229e77d097f80a212cf03c6dff0bc88e0ef37eed
      - name: Publish only the exact existing unprotected PR38 work branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B "$RUNNER_TEMP/repair.py" publish
